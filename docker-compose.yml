version: '3.8'

# ============================================================
# Kafka + Spark Streaming - Docker Compose
# Stack: Zookeeper, Kafka, Kafka UI
# ============================================================

services:

  # ----------------------------------------------------------
  # Zookeeper: Koordinator cluster Kafka
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  # ----------------------------------------------------------
  # Kafka Broker
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"    # Untuk akses dari host (producer/consumer lokal)
      - "29092:29092"  # Untuk akses dari dalam Docker network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'   # Topic dibuat manual agar terkontrol
      KAFKA_LOG_RETENTION_HOURS: 1               # Simpan log hanya 1 jam (untuk dev)
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ----------------------------------------------------------
  # Kafka UI: Web interface untuk monitoring topic & message
  # Akses di: http://localhost:8080
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: 'true'

  # ----------------------------------------------------------
  # Kafka Init: Auto-create topic saat startup
  # ----------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo '--- Membuat Kafka Topics ---'

      kafka-topics --create \
        --bootstrap-server kafka:29092 \
        --replication-factor 1 \
        --partitions 3 \
        --topic transactions \
        --if-not-exists

      kafka-topics --create \
        --bootstrap-server kafka:29092 \
        --replication-factor 1 \
        --partitions 3 \
        --topic transactions_valid \
        --if-not-exists

      kafka-topics --create \
        --bootstrap-server kafka:29092 \
        --replication-factor 1 \
        --partitions 3 \
        --topic transactions_dlq \
        --if-not-exists

      echo '--- Topics berhasil dibuat ---'
      kafka-topics --list --bootstrap-server kafka:29092
      "
    restart: "no"

# ----------------------------------------------------------
# Volumes untuk persistent data
# ----------------------------------------------------------
volumes:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
